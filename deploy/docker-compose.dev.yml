# Dev dependencies: `docker compose -f deploy/docker-compose.dev.yml up -d`
name: builder-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: builder
      POSTGRES_PASSWORD: builder
      POSTGRES_DB: builder
    ports:
      - "15433:5432"
    volumes:
      - builder-pg:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  builder-pg:
